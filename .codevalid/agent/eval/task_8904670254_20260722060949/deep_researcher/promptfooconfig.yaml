# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Agent eval — deep_researcher (breakdown task_8904670254_20260722060949)"

prompts:
  - "{{ user_message }}"

providers:
  - file://providers.yaml

defaultTest:
  options:
    provider: file://../../../shared/judge_provider.yaml
    rubricPrompt: file://../../../shared/rubric_prompt.json
  assert:
    - type: llm-rubric
      value: "{{ rubric }}"

tests:
  - description: "Complete Research Workflow - End-to-End Happy Path"
    vars:
      test_case_id: "happy_path_complete_research_workflow"
      user_message: "I need a comprehensive research report on the current state of quantum computing in healthcare, focusing on drug discovery applications in the last 2 years."
      rubric: |
        - executes clarification phase before research - generates a structured research brief from user request - invokes supervisor_subgraph for multi-agent research phase - calls final_report_generation after research completion - returns a final structured research report to user - maintains correct phase ordering throughout workflow
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled in configuration",
                        "research_model is configured",
                        "final_report_model is configured",
                        "supervisor_subgraph stub exists"
                ]
        }
    metadata:
      test_case_id: "happy_path_complete_research_workflow"

  - description: "Clarification Disabled - Skip Clarification Phase"
    vars:
      test_case_id: "clarification_disabled_skips_to_brief"
      user_message: "Research the latest advancements in solid-state batteries for electric vehicles."
      rubric: |
        - skips clarify_with_user when allow_clarification is false - proceeds directly to write_research_brief - does not ask user for additional clarification - executes research and final report phases in order - respects configuration settings
      scenario_type: "happy_path"
      expected_tools: '["write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is set to false in configuration",
                        "research request is sufficiently clear context exists",
                        "all other configuration is valid"
                ]
        }
    metadata:
      test_case_id: "clarification_disabled_skips_to_brief"

  - description: "Clarification Phase - User Resolution Flow"
    vars:
      test_case_id: "clarification_needed_user_interaction"
      user_message: "Tell me about AI."
      rubric: |
        - recognizes that request is too broad or ambiguous - calls clarify_with_user to determine if clarification needed - returns END with clarifying question for user - does not proceed to write_research_brief yet - asks user for specific focus area or scope
      scenario_type: "missing_info"
      expected_tools: '["clarify_with_user"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled",
                        "clarification model is configured",
                        "user request is deliberately vague"
                ]
        }
    metadata:
      test_case_id: "clarification_needed_user_interaction"

  - description: "Research Brief Generation - Structured Output"
    vars:
      test_case_id: "research_brief_generation_from_context"
      user_message: "Investigate the environmental impact of lithium mining in South America, focusing on water usage and community health effects from 2020-2024."
      rubric: |
        - calls write_research_brief with user messages - generates structured ResearchQuestion output - extracts key research topics and sub-questions - initializes supervisor context with research brief - passes brief to supervisor_subgraph for research phase
      scenario_type: "happy_path"
      expected_tools: '["write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "clarification phase is complete or skipped",
                        "research_model supports structured output",
                        "max_structured_output_retries is configured"
                ]
        }
    metadata:
      test_case_id: "research_brief_generation_from_context"

  - description: "Final Report Generation - Findings Synthesis"
    vars:
      test_case_id: "final_report_synthesis"
      user_message: "Summarize the research findings on renewable energy adoption in Southeast Asia."
      rubric: |
        - calls final_report_generation after research phase completes - uses research_brief as foundation for report - synthesizes all processed findings from notes - generates a single coherent structured report - returns concise report derived from upstream research - clears notes state after successful generation
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research_brief exists in state",
                        "notes contain collected research findings",
                        "final_report_model is configured",
                        "supervisor_subgraph has completed its research phase"
                ]
        }
    metadata:
      test_case_id: "final_report_synthesis"

  - description: "Final Report - Token Limit Exceeded Recovery"
    vars:
      test_case_id: "token_limit_retry_logic"
      user_message: "Generate a comprehensive report on global climate change impacts from 1900 to 2024 with detailed analysis."
      rubric: |
        - attempts final_report_generation - detects token limit exceeded errors via is_token_limit_exceeded - implements retry logic up to max_retries - adjusts findings or parameters on retry - eventually succeeds or gracefully fails - does not lose research_brief or critical findings
      scenario_type: "edge_case"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research findings are large enough to potentially exceed token limits",
                        "is_token_limit_exceeded function is available",
                        "get_model_token_limit can determine model capacity",
                        "final_report_model has known token limit"
                ]
        }
    metadata:
      test_case_id: "token_limit_retry_logic"

  - description: "Supervisor Subgraph Invocation - Multi-Agent Orchestration"
    vars:
      test_case_id: "supervisor_phase_invocation"
      user_message: "Research the pros and cons of nuclear energy as a transitional energy source."
      rubric: |
        - invokes supervisor_subgraph after brief generation - passes research_brief to supervisor - supervisor_subgraph is called in correct sequence position - workflow waits for supervisor completion before final report - research phase occurs between brief and final report
      scenario_type: "happy_path"
      expected_tools: '["write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "write_research_brief has successfully generated research brief",
                        "supervisor_subgraph stub exists in pipeline",
                        "max_concurrent_research_units is configured"
                ]
        }
    metadata:
      test_case_id: "supervisor_phase_invocation"

  - description: "Empty Request Handling - Validation Edge Case"
    vars:
      test_case_id: "empty_request_validation"
      user_message: ""
      rubric: |
        - recognizes empty or missing request - does not proceed through full workflow - may ask user for clarification or valid request - does not generate research brief from empty input - maintains graceful failure mode
      scenario_type: "edge_case"
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled",
                        "messages array contains empty or minimal content"
                ]
        }
    metadata:
      test_case_id: "empty_request_validation"

  - description: "Ambiguous Scope - Mandatory Clarification"
    vars:
      test_case_id: "ambiguous_scope_requires_clarification"
      user_message: "Find information about the thing."
      rubric: |
        - detects that research scope is unclear - calls clarify_with_user to analyze request - returns Command with END and clarifying question - does not proceed to write_research_brief - asks user to specify topic, scope, or focus area
      scenario_type: "missing_info"
      expected_tools: '["clarify_with_user"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled",
                        "clarification model can assess need_clarification",
                        "request is deliberately ambiguous"
                ]
        }
    metadata:
      test_case_id: "ambiguous_scope_requires_clarification"

  - description: "Configuration - Model Selection per Phase"
    vars:
      test_case_id: "configuration_model_selection"
      user_message: "Analyze recent developments in CRISPR gene editing for agricultural applications."
      rubric: |
        - uses research_model for clarification analysis - uses research_model for brief generation - uses final_report_model for final report synthesis - respects model-specific token limits - applies correct API keys for each model provider - maintains separation between research and report models
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research_model is configured (e.g., openai:gpt-4o)",
                        "final_report_model is configured (e.g., anthropic:claude-3)",
                        "API keys for both models are available",
                        "Configuration.from_runnable_config extracts settings correctly"
                ]
        }
    metadata:
      test_case_id: "configuration_model_selection"

  - description: "Findings Compression - Context Isolation"
    vars:
      test_case_id: "findings_compression_for_context"
      user_message: "Research AI safety approaches across OpenAI, Anthropic, Google DeepMind, and academic institutions."
      rubric: |
        - supervisor_subgraph processes research findings - findings are returned in compressed form - compressed findings maintain source citations - token usage is managed across research sub-agents - context isolation is preserved between phases - final_report_generation receives compressed findings
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research produces multiple findings",
                        "compression logic exists in supervisor subgraph",
                        "token limits are configured appropriately"
                ]
        }
    metadata:
      test_case_id: "findings_compression_for_context"
