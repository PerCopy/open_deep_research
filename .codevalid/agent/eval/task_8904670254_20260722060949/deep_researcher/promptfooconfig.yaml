# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Agent eval — deep_researcher (breakdown task_8904670254_20260722060949)"

prompts:
  - "{{ user_message }}"

providers:
  - file://providers.yaml

defaultTest:
  options:
    provider: file://../../../shared/judge_provider.yaml
    rubricPrompt: file://../../../shared/rubric_prompt.json
  assert:
    - type: llm-rubric
      value: "{{ rubric }}"

tests:
  - description: "Happy Path - Complete Research Workflow Execution"
    vars:
      test_case_id: "happy_path_complete_workflow"
      user_message: "Research the current state of electric vehicle battery recycling technology, focusing on recent innovations and environmental impact."
      rubric: |
        - invokes clarify_with_user to check if clarification is needed - proceeds to write_research_brief to create structured research brief - invokes supervisor_subgraph to conduct research - invokes final_report_generation to synthesize findings - returns a structured, concise research report - maintains stage ordering: clarify_with_user before write_research_brief, write_research_brief before supervisor_subgraph, supervisor_subgraph before final_report_generation
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "clarify_with_user determines no clarification needed",
                        "research model (openai:gpt-4.1) and final_report model (openai:gpt-4.1) are available",
                        "supervisor_subgraph executes successfully"
                ]
        }
    metadata:
      test_case_id: "happy_path_complete_workflow"

  - description: "Model Configuration - Summarization Stage Default Model"
    vars:
      test_case_id: "model_name_summarization_default"
      user_message: "Find recent developments in quantum computing hardware and provide a brief report."
      rubric: |
        - mention of summarization model default 'openai:gpt-4.1-mini' in workflow configuration or logs - does not alter default summarization model unless explicitly reconfigured - workflow proceeds through all four stages in correct order
      scenario_type: "validation"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "default summarization model is configured as 'openai:gpt-4.1-mini'",
                        "workflow is executed with default configuration"
                ]
        }
    metadata:
      test_case_id: "model_name_summarization_default"

  - description: "Model Configuration - Research Stage Default Model"
    vars:
      test_case_id: "model_name_research_default"
      user_message: "Investigate the environmental impact of microplastics in ocean ecosystems."
      rubric: |
        - mention of research model default 'openai:gpt-4.1' in configuration for write_research_brief or supervisor_subgraph - does not alter default research model unless explicitly reconfigured - research brief generated shows evidence of research model processing
      scenario_type: "validation"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "default research model is configured as 'openai:gpt-4.1'",
                        "research_model_max_tokens is appropriately set"
                ]
        }
    metadata:
      test_case_id: "model_name_research_default"

  - description: "Model Configuration - Final Report Stage Default Model"
    vars:
      test_case_id: "model_name_final_report_default"
      user_message: "Analyze recent breakthroughs in CRISPR gene editing technology."
      rubric: |
        - mention of final report model default 'openai:gpt-4.1' in final_report_generation configuration - does not alter default final report model unless explicitly reconfigured - final_report_model_max_tokens is configured appropriately
      scenario_type: "validation"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "default final report model is configured as 'openai:gpt-4.1'",
                        "final_report_model_max_tokens is set"
                ]
        }
    metadata:
      test_case_id: "model_name_final_report_default"

  - description: "Missing Info - Clarification Required from User"
    vars:
      test_case_id: "missing_info_clarification_needed"
      user_message: "I need research on renewable energy."
      rubric: |
        - invokes clarify_with_user and determines clarification is needed - returns a clarifying question to the user - does NOT proceed to write_research_brief until clarified - does NOT invoke supervisor_subgraph or final_report_generation
      scenario_type: "missing_info"
      expected_tools: '["clarify_with_user"]'
      precondition:
        {
                "hints": [
                        "clarify_with_user is enabled (allow_clarification=True)",
                        "research scope is ambiguous or too broad"
                ]
        }
    metadata:
      test_case_id: "missing_info_clarification_needed"

  - description: "Edge Case - Clarification Disabled, Direct to Research Brief"
    vars:
      test_case_id: "edge_case_clarification_disabled"
      user_message: "Research the latest developments in solid-state battery technology."
      rubric: |
        - clarify_with_user checks configuration and finds allow_clarification=False - immediately routes to write_research_brief without asking clarifying question - proceeds through all stages in order: write_research_brief → supervisor_subgraph → final_report_generation - no clarifying question is asked to user
      scenario_type: "edge_case"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is set to False in configuration",
                        "research request is clear enough to proceed"
                ]
        }
    metadata:
      test_case_id: "edge_case_clarification_disabled"

  - description: "Happy Path - Structured Concise Final Report Output"
    vars:
      test_case_id: "happy_path_structured_final_report"
      user_message: "Provide research on the adoption of artificial intelligence in healthcare diagnostics, focusing on accuracy improvements and ethical considerations."
      rubric: |
        - final_report_generation synthesizes all collected research notes - output is a structured research report (has clear sections or organization) - output is concise (not overly verbose, focused on key findings) - report content is derived from upstream research findings (references research brief or notes) - report incorporates date information via get_today_str
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "supervisor_subgraph has collected research notes",
                        "state contains 'notes' and 'research_brief' fields",
                        "final_report_model successfully generates report"
                ]
        }
    metadata:
      test_case_id: "happy_path_structured_final_report"

  - description: "Edge Case - Token Limit Exceeded, Retry Logic"
    vars:
      test_case_id: "edge_case_token_limit_retry"
      user_message: "Comprehensive research on the complete history of semiconductor industry from 1950 to present."
      rubric: |
        - final_report_generation attempts report generation - when token limit exceeded error occurs, detects it via is_token_limit_exceeded - retries report generation with reduced findings (uses get_model_token_limit to determine reduction) - eventually succeeds or gracefully fails after max_retries (3 attempts) - if successful, returns structured final report
      scenario_type: "edge_case"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research findings are large enough to potentially exceed model token limit",
                        "final_report_model has token limit configured"
                ]
        }
    metadata:
      test_case_id: "edge_case_token_limit_retry"

  - description: "Validation - Stage Order Enforcement"
    vars:
      test_case_id: "validation_stage_ordering"
      user_message: "Research the impact of climate change on global food security."
      rubric: |
        - clarify_with_user executes first (or is skipped only if disabled) - write_research_brief executes after clarify_with_user - supervisor_subgraph executes after write_research_brief - final_report_generation executes after supervisor_subgraph - no stage is skipped (except clarify_with_user when disabled) - no stages are invoked out of order
      scenario_type: "validation"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "clarify_with_user is enabled",
                        "all stages are configured and functional"
                ]
        }
    metadata:
      test_case_id: "validation_stage_ordering"
