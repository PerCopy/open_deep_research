# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Agent eval — deep_researcher (breakdown task_8904670254_20260722060949)"

prompts:
  - "{{ user_message }}"

providers:
  - file://providers.yaml

defaultTest:
  options:
    provider: file://../../../shared/judge_provider.yaml
    rubricPrompt: file://../../../shared/rubric_prompt.json
  assert:
    - type: llm-rubric
      value: "{{ rubric }}"

tests:
  - description: "Complete research workflow execution"
    vars:
      test_case_id: "happy_path_full_workflow"
      user_message: "I need a comprehensive research report on the current state of quantum computing applications in drug discovery, focusing on pharmaceutical industry adoption and future prospects."
      rubric: |
        - executes clarification phase before proceeding to research - generates or uses a research brief before calling supervisor - invokes supervisor_subgraph for multi-agent research phase - calls final_report_generation after supervisor phase completes - returns a structured, concise research report - report content reflects research findings from the workflow
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "clarification is enabled in configuration",
                        "search APIs are available and configured"
                ]
        }
    metadata:
      test_case_id: "happy_path_full_workflow"

  - description: "Workflow proceeds directly when clarification disabled"
    vars:
      test_case_id: "happy_path_skip_clarification"
      user_message: "Research the competitive landscape of electric vehicle battery manufacturers in 2024."
      rubric: |
        - does not invoke clarify_with_user when clarification is disabled - proceeds directly to research brief generation - invokes supervisor_subgraph for research phase - calls final_report_generation after research completes - returns a complete research report
      scenario_type: "happy_path"
      expected_tools: '["write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is set to false in configuration"
                ]
        }
    metadata:
      test_case_id: "happy_path_skip_clarification"

  - description: "Clarification phase asks for more context"
    vars:
      test_case_id: "missing_info_vague_request"
      user_message: "Research AI."
      rubric: |
        - invokes clarify_with_user function - detects need for clarification based on vague input - returns a clarifying question or asks for scope refinement - does not proceed to write_research_brief yet - asks the user for more specific research parameters
      scenario_type: "missing_info"
      expected_tools: '["clarify_with_user"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled",
                        "input is intentionally vague"
                ]
        }
    metadata:
      test_case_id: "missing_info_vague_request"

  - description: "Research brief generation from user input"
    vars:
      test_case_id: "happy_path_specific_research_brief"
      user_message: "I need to understand the regulatory framework for cryptocurrency exchanges in the European Union, specifically focusing on MiCA regulation compliance requirements for 2025."
      rubric: |
        - generates a structured research brief from user input - brief includes focused research scope - brief captures specific topic requirements - proceeds to supervisor phase after brief creation - uses appropriate model configuration for brief generation
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief"]'
      precondition:
        {
                "hints": [
                        "clarification is enabled",
                        "input is specific enough to not require additional questions"
                ]
        }
    metadata:
      test_case_id: "happy_path_specific_research_brief"

  - description: "Final report synthesizes research findings"
    vars:
      test_case_id: "happy_path_final_report_generation"
      user_message: "Generate the final report for my research on sustainable packaging innovations in the food industry."
      rubric: |
        - invokes final_report_generation with research context - generates a single, coherent structured report - report is derived from research brief and collected findings - report is concise and well-organized - clears or resets notes state after report generation
      scenario_type: "happy_path"
      expected_tools: '["final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research brief and findings exist in state",
                        "supervisor phase has completed"
                ]
        }
    metadata:
      test_case_id: "happy_path_final_report_generation"

  - description: "Final report retries on token limit errors"
    vars:
      test_case_id: "edge_case_token_limit_retry"
      user_message: "Complete the research report with all detailed findings."
      rubric: |
        - invokes final_report_generation - detects token limit exceeded errors correctly - implements retry logic when token limit is hit - may compress findings on retry to fit token limits - eventually returns a complete report or handles gracefully
      scenario_type: "edge_case"
      expected_tools: '["final_report_generation"]'
      precondition:
        {
                "hints": [
                        "findings are large enough to potentially trigger token limits",
                        "model token limits are configured"
                ]
        }
    metadata:
      test_case_id: "edge_case_token_limit_retry"

  - description: "Supervisor decomposes research into sub-topics"
    vars:
      test_case_id: "happy_path_supervisor_decomposition"
      user_message: "I need research on renewable energy across solar, wind, and hydroelectric power generation technologies, including efficiency comparisons."
      rubric: |
        - supervisor decomposes research brief into distinct sub-topics - spawns one or more research sub-agents - sub-agents operate with tool-calling loops - findings are compressed before returning to supervisor - supervisor determines sufficient coverage before final report
      scenario_type: "happy_path"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "research brief contains multiple distinct sub-topics",
                        "allow_clarification is enabled"
                ]
        }
    metadata:
      test_case_id: "happy_path_supervisor_decomposition"

  - description: "Tool selection based on input specificity"
    vars:
      test_case_id: "tool_selection_clarify_vs_direct"
      user_message: "Please research the top 5 cybersecurity frameworks used in healthcare organizations for HIPAA compliance in 2024."
      rubric: |
        - clarify_with_user analyzes input for scope clarity - determines request is specific enough to proceed - routes to write_research_brief without asking questions - continues through supervisor and final report phases - does not unnecessarily block for clarification
      scenario_type: "tool_selection"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "allow_clarification is enabled",
                        "input contains specific parameters and scope"
                ]
        }
    metadata:
      test_case_id: "tool_selection_clarify_vs_direct"

  - description: "Final report handles minimal or empty findings"
    vars:
      test_case_id: "edge_case_empty_findings"
      user_message: "Research obscure topic xyz123 that has no available information."
      rubric: |
        - workflow completes all phases despite limited findings - final report acknowledges limited or no information available - does not crash or return error for empty findings - report is still structured and coherent - may suggest areas for further research
      scenario_type: "edge_case"
      expected_tools: '["clarify_with_user", "write_research_brief", "supervisor_subgraph", "final_report_generation"]'
      precondition:
        {
                "hints": [
                        "search APIs return minimal or no results for the topic"
                ]
        }
    metadata:
      test_case_id: "edge_case_empty_findings"
